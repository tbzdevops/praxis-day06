name: Build & Upload Artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build (sdist + wheel)
        run: python -m build

      # Aufgabe: Ergänze hier einen Schritt mit actions/upload-artifact@v4.
      # Das Artefakt soll den Inhalt des dist/-Ordners speichern.
