name: Publish Package to pypiserver

on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      # Aufgabe: Ergänze hier den Upload des Pakets in deinen pypiserver.
      # Verwende dafür GitHub Secrets für URL, Benutzername und Passwort.

